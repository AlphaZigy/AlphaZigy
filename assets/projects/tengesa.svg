<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="Tengesa POS">
<title>Tengesa POS — Offline-first point of sale for Zimbabwean retail, with signed offline licences and EcoCash / OneMoney billing.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#141B26"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F472B6"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="acc2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FBBF24" stop-opacity=".35"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="440" height="236" rx="18"/></clipPath>
<style>
.title{font:700 21px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F0F6FC}
.cat{font:600 10.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#FBBF24;letter-spacing:1.6px}
.desc{font:400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#9DA7B3}
.chip{font:600 11.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#C9D1D9}
.status{font:700 10.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#FBBF24;letter-spacing:.6px}
.glow{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.shine{animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-160px)}60%,100%{transform:translateX(600px)}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="440" height="236" fill="url(#bg)"/>
<circle class="glow" cx="400" cy="30" r="130" fill="url(#glow)"/>
<rect class="shine" x="0" y="0" width="90" height="236" fill="#FFFFFF" opacity=".035" transform="skewX(-20)"/>
<rect width="440" height="3" fill="url(#acc2)"/>
</g>
<rect x=".75" y=".75" width="438.5" height="234.5" rx="17.5" fill="none" stroke="url(#acc)" stroke-opacity=".55" stroke-width="1.5"/>
<rect x="24" y="24" width="52" height="52" rx="14" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".35"/>
<text x="50" y="59" text-anchor="middle" font-size="26">🧾</text>
<text x="92" y="44" class="cat">FINTECH · RETAIL</text>
<text x="92" y="69" class="title">Tengesa POS</text>
<rect x="349.4" y="24" width="66.6" height="22" rx="11" fill="#FBBF24" fill-opacity=".1" stroke="#FBBF24" stroke-opacity=".4"/>
<text x="382.7" y="39" text-anchor="middle" class="status">PRIVATE</text>
<text x="24" y="118" class="desc">Offline-first point of sale for Zimbabwean retail, with signed</text><text x="24" y="139" class="desc">offline licences and EcoCash / OneMoney billing.</text>
<rect x="24.0" y="188" width="46.0" height="24" rx="12" fill="#161B22" stroke="#30363D"/><text x="47.0" y="204" text-anchor="middle" class="chip">Expo</text><rect x="78.0" y="188" width="58.5" height="24" rx="12" fill="#161B22" stroke="#30363D"/><text x="107.3" y="204" text-anchor="middle" class="chip">SQLite</text><rect x="144.5" y="188" width="57.3" height="24" rx="12" fill="#161B22" stroke="#30363D"/><text x="173.1" y="204" text-anchor="middle" class="chip">Django</text><rect x="209.8" y="188" width="57.3" height="24" rx="12" fill="#161B22" stroke="#30363D"/><text x="238.4" y="204" text-anchor="middle" class="chip">Paynow</text>
</svg>
