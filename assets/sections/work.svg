<svg xmlns="http://www.w3.org/2000/svg" width="880" height="78" viewBox="0 0 880 78" role="img" aria-label="Featured Work">
<title>Featured Work</title>
<defs>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".7"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
<style>
.h{font:800 30px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:url(#t)}
.sub{font:500 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#8B949E;letter-spacing:.4px}
.bar{animation:grow 2.4s ease-in-out infinite alternate;transform-origin:0 50%}
@keyframes grow{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
</style>
</defs>
<rect class="bar" x="4" y="10" width="5" height="58" rx="2.5" fill="url(#t)"/>
<text x="22" y="38" class="h">Featured Work</text>
<rect x="254.8" y="28.1" width="621.2" height="1.5" fill="url(#fade)"/>
<text x="22" y="64" class="sub">selected products, platforms and research</text>
</svg>
